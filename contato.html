<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <div class="logo">📽️CineSenai</div>
        <nav>
            <a href="index.html">Em Cartaz</a>
            <a href="">Em Breve</a>
            <a href="">Preços</a>
            <a href="">Contato</a>
        </nav>
    </header>
    
    <main class="container">
        <h1>Cadastro para dicas de Filmes</h1>
        <p>Preencha seus dados para realizar a inscrição no CineSenai</p>

        <div class="area-inscricao">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">nome:</label>
                <input type="text" id="nome" name="nome" placeholder="digite seu nome completo" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" 
                placeholder="exemplo@dominio.com" required>br

                <label for="data_nasc">Data_Nascimento:</label>
                <input type="date" id="data_nasc" name="Data_Nascimento"
                min="1990-01-01" max="2026-12=31" required>br

                <label>Período dos Filmes</label><br>
                <input type="radio" id="turno" name="turno" value="tarde" required>
                <label for="turno_manha">Manhã</label>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">noite</label><br><br>

                <label>Filmes de Interesse</label>
                <input type="checkbox" id="acao" name="Interesse" value="acao">
                <label for="acao">Filmes de Comédia</label>

                <input type="checkbox" id="terror" name="Interesse" value="terror">
                <label for="terror"> Filmes de Terror</label><br><br>

                <label for="unidade">Selecione o Cinema</label>
                <select name="unidade" id="unidade" required>
                    <option value="" disa sselected>Selecione um cinema</option>
                    <option value="sp">São Paulo - capital</option>
                    <option value="Sebastianopolis">Sebastianópolis do Sul</option>
                    <option value="Votuporanga">Votuporanga</option>
                    <option value="Valentim">Valentim Gentil</option>
                </select>   

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos"> Li e Acerto os termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">limpar tudo</button>

            </form>

            <div class="coluna-media">
                <iframe src="<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3733.274746602292!2d-49.92454201044915!3d-20.658398366224738!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd64b1f3d46219%3A0x983ea8986b35a770!2sSebastian%C3%B3polis%20do%20Sul%2C%20SP%2C%2015180-000!5e0!3m2!1spt-BR!2sbr!4v1787665718693!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>"

                <iframe width="560" height="315" src="https://www.youtube.com/embed/bTr59z0dohw?si=MH98vke4iA96Z_tK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                



            </form>

        </div>

    </main>

</body>
</html>
